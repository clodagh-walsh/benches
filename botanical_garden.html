<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benches of the Botanical Gardens</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg:          #d2d8c2;
    --bg-subtle:   #d8deca;
    --bg-pane:     #cbd3bb;
    --dark:        #ede8f5;
    --text:        #242820;
    --text-dim:    #4e5840;
    --text-dimmer: #848e72;
    --serif: Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--serif); }

  /* ── Animation section ── */
  .anim-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 44px 0 36px;
    background: var(--bg);
    position: relative;
  }
  .anim-eyebrow {
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--text-dimmer);
    font-family: system-ui, sans-serif;
    margin-bottom: 8px;
  }
  .anim-title {
    font-size: 1.6rem;
    font-weight: normal;
    color: var(--text);
    margin-bottom: 4px;
    letter-spacing: 0.02em;
  }
  .anim-sub {
    font-size: 0.75rem;
    color: var(--text-dimmer);
    font-family: system-ui, sans-serif;
    letter-spacing: 0.05em;
    margin-bottom: 28px;
  }

  #anim-svg-wrap {
    position: relative;
    width: 700px;
    max-width: 100%;
  }
  #anim-svg {
    width: 100%;
    height: auto;
    display: block;
  }

  /* Route paths — animated */
  .route-path {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    animation: drawPath var(--dur) var(--delay) cubic-bezier(0.4,0,0.2,1) forwards;
    stroke-dashoffset: var(--len);
    stroke-dasharray: var(--len);
    opacity: 0;
  }
  @keyframes drawPath {
    0%   { stroke-dashoffset: var(--len); opacity: 0; }
    3%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
  }

  /* After all drawn, gentle shimmer */
  .route-path.shimmer {
    animation: drawPath var(--dur) var(--delay) cubic-bezier(0.4,0,0.2,1) forwards,
               breathe 3s ease-in-out var(--breathe-delay) infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.72; }
  }

  /* Replay button */
  .replay-btn {
    margin-top: 20px;
    padding: 7px 22px;
    background: transparent;
    border: 1px solid #a0aa90;
    color: var(--text-dim);
    font-family: system-ui, sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .replay-btn:hover { background: var(--bg-pane); border-color: var(--text-dimmer); }

  /* Legend */
  .anim-legend {
    display: flex;
    gap: 18px;
    margin-top: 18px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .legend-route {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 0.7rem;
    color: var(--text-dim);
    font-family: system-ui, sans-serif;
    opacity: 0;
    transition: opacity 0.5s;
  }
  .legend-route.visible { opacity: 1; }
  .legend-line { width: 18px; height: 2px; border-radius: 1px; }

  /* ── Divider ── */
  .section-divider {
    height: 1px;
    background: linear-gradient(to right, transparent, #b8c2a8, transparent);
    margin: 0;
  }

  /* ── Bench map section ── */
  .map-section {
    background: var(--bg);
    padding: 40px 0 0;
  }
  .map-header {
    text-align: center;
    padding: 0 20px 28px;
    color: var(--text);
  }
  .map-eyebrow {
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--text-dimmer);
    font-family: system-ui, sans-serif;
    margin-bottom: 8px;
  }
  .map-title { font-size: 1.45rem; font-weight: normal; margin-bottom: 4px; }
  .map-sub { font-size: 0.75rem; color: var(--text-dimmer); font-family: system-ui, sans-serif; letter-spacing: 0.04em; }

  #bench-map {
    width: 100%;
    height: 520px;
    background: var(--bg-subtle);
  }

  /* Bench filter pills */
  .bench-filters {
    display: flex;
    gap: 8px;
    justify-content: center;
    padding: 0 20px 20px;
    flex-wrap: wrap;
  }
  .filter-pill {
    padding: 5px 14px;
    border-radius: 20px;
    border: 1px solid #a0aa90;
    background: transparent;
    color: var(--text-dim);
    font-size: 0.7rem;
    font-family: system-ui, sans-serif;
    cursor: pointer;
    letter-spacing: 0.03em;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .filter-pill:hover { background: var(--bg-pane); }
  .filter-pill.active { color: #fff; border-color: transparent; }
  .filter-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  /* Leaflet custom popup */
  .leaflet-popup-content-wrapper {
    background: var(--bg-pane) !important;
    border-radius: 8px !important;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12) !important;
    border: none !important;
  }
  .leaflet-popup-tip { background: var(--bg-pane) !important; }
  .leaflet-popup-content { margin: 12px 14px !important; }
  .popup-date {
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dimmer);
    font-family: system-ui, sans-serif;
    margin-bottom: 5px;
  }
  .popup-ded {
    font-size: 0.82rem;
    color: var(--text);
    line-height: 1.6;
    font-family: Georgia, serif;
    white-space: pre-wrap;
  }
  .popup-no-ded {
    font-size: 0.75rem;
    color: var(--text-dimmer);
    font-style: italic;
    font-family: Georgia, serif;
  }

  /* Stat strip */
  .stat-strip {
    display: flex;
    justify-content: center;
    gap: 40px;
    padding: 22px 20px;
    background: var(--bg-pane);
    border-top: 1px solid #b8c2a8;
  }
  .stat-item { text-align: center; }
  .stat-num { font-size: 1.6rem; font-weight: normal; color: var(--text); line-height: 1; }
  .stat-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dimmer); font-family: system-ui, sans-serif; margin-top: 3px; }
  .osm-muted { filter: grayscale(70%); }
  .bench-icon { background: none; border: none; }
  .bench-icon svg { display: block; }
</style>
</head>
<body>

<!-- ── ANIMATION SECTION ── -->
<div class="anim-section">
  <div class="anim-eyebrow">SF Botanical Garden · Golden Gate Park</div>
  <div class="anim-title">Benches of the Botanical Gardens</div>
  <div class="anim-sub">March – May 2026</div>

  <div id="anim-svg-wrap">
    <svg id="anim-svg" viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="0.8" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <!-- Background -->
      <rect width="700" height="500" fill="#d2d8c2"/>

      <!-- Route paths injected by JS -->
      <g id="routes-group" filter="url(#glow)"></g>
      <g id="routes-base"></g>
    </svg>
  </div>

  <div class="anim-legend" id="anim-legend"></div>
  <button class="replay-btn" onclick="replayAnimation()">&#8635; replay</button>
</div>

<div class="section-divider"></div>

<!-- ── BENCH MAP SECTION ── -->
<div class="map-section">
  <div class="map-header">
    <div class="map-eyebrow">178 benches catalogued</div>
    <div class="map-title">The Garden's Benches</div>
    <div class="map-sub">click any bench to read its dedication</div>
  </div>

  <div class="bench-filters" id="bench-filters">
    <button class="filter-pill active" data-date="all" onclick="filterBenches('all', this)"
            style="background:var(--text-dim);border-color:var(--text-dim);color:#fff">
      All walks
    </button>
  </div>

  <div id="bench-map"></div>

  <div class="stat-strip">
    <div class="stat-item">
      <div class="stat-num">8</div>
      <div class="stat-label">walks</div>
    </div>
    <div class="stat-item">
      <div class="stat-num">178</div>
      <div class="stat-label">benches</div>
    </div>
    <div class="stat-item">
      <div class="stat-num" id="ded-count">—</div>
      <div class="stat-label">with dedications</div>
    </div>
  </div>
</div>

// ── ANIMATION ──
const WALK_COLORS = {
  '3/7/26':  '#7a58a8',
  '3/11/26': '#7a58a8',
  '4/6/26':  '#7a58a8',
  '4/15/26': '#7a58a8',
  '4/29/26': '#7a58a8',
  '5/5/26':  '#7a58a8',
  '5/14/26': '#7a58a8',
  '5/20/26': '#7a58a8',
};

const BASE_DUR   = 4.2;   // seconds per route
const ROUTE_GAP  = 0.6;   // gap between routes starting
const SHIMMER_AFTER = ROUTES_SVG.length * (BASE_DUR + ROUTE_GAP) + 0.5;

function buildAnimation() {
  var group = document.getElementById('routes-group');
  var base  = document.getElementById('routes-base');
  group.innerHTML = '';
  base.innerHTML  = '';
  var legend = document.getElementById('anim-legend');
  legend.innerHTML = '';

  ROUTES_SVG.forEach(function(r, i) {
    var delay = i * (BASE_DUR * 0.55 + ROUTE_GAP * 0.4);
    var breatheDelay = SHIMMER_AFTER + 's';

    // Glow path (thicker, blurred via filter on parent)
    var gp = document.createElementNS('http://www.w3.org/2000/svg','path');
    gp.setAttribute('d', r.d);
    gp.setAttribute('stroke', r.color);
    gp.setAttribute('stroke-width', '3.2');
    gp.setAttribute('class', 'route-path');
    gp.style.setProperty('--len', r.length + 'px');
    gp.style.setProperty('--dur', BASE_DUR + 's');
    gp.style.setProperty('--delay', delay + 's');
    gp.style.setProperty('--breathe-delay', breatheDelay);
    gp.style.opacity = '0';
    group.appendChild(gp);

    // Crisp path on top
    var cp = document.createElementNS('http://www.w3.org/2000/svg','path');
    cp.setAttribute('d', r.d);
    cp.setAttribute('stroke', r.color);
    cp.setAttribute('stroke-width', '1.4');
    cp.setAttribute('class', 'route-path');
    cp.style.setProperty('--len', r.length + 'px');
    cp.style.setProperty('--dur', BASE_DUR + 's');
    cp.style.setProperty('--delay', delay + 's');
    cp.style.setProperty('--breathe-delay', breatheDelay);
    cp.style.opacity = '0';
    base.appendChild(cp);

    // Legend item — reveal when route starts drawing
    var li = document.createElement('div');
    li.className = 'legend-route';
    li.id = 'legend-' + i;
    li.innerHTML =
      '<div class="legend-line" style="background:' + r.color + '"></div>' +
      '<span>' + r.display + '</span>';
    legend.appendChild(li);

    setTimeout(function() {
      li.classList.add('visible');
    }, (delay * 1000) + 200);
  });
}

function replayAnimation() {
  var group = document.getElementById('routes-group');
  var base  = document.getElementById('routes-base');
  // Remove + re-add paths to restart CSS animations
  var gpaths = Array.from(group.children);
  var bpaths = Array.from(base.children);
  gpaths.forEach(function(p) { p.style.animation = 'none'; });
  bpaths.forEach(function(p) { p.style.animation = 'none'; });
  document.getElementById('anim-legend').querySelectorAll('.legend-route')
    .forEach(function(l) { l.classList.remove('visible'); });

  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      buildAnimation();
    });
  });
}

buildAnimation();

// ── BENCH MAP ──
var benchMap = L.map('bench-map', {
  center: [37.7680, -122.4672],
  zoom: 16,
  zoomControl: true,
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors', className: 'osm-muted',
  maxZoom: 19,
  opacity: 0.55,
}).addTo(benchMap);

// Build filter pills
var walkDates = [
  { date: '3/7/26',  display: 'Mar 7',  color: '#7a58a8' },
  { date: '3/11/26', display: 'Mar 11', color: '#7a58a8' },
  { date: '4/6/26',  display: 'Apr 6',  color: '#7a58a8' },
  { date: '4/15/26', display: 'Apr 15', color: '#7a58a8' },
  { date: '4/29/26', display: 'Apr 29', color: '#7a58a8' },
  { date: '5/5/26',  display: 'May 5',  color: '#7a58a8' },
  { date: '5/14/26', display: 'May 14', color: '#7a58a8' },
  { date: '5/20/26', display: 'May 20', color: '#7a58a8' },
];
var filterContainer = document.getElementById('bench-filters');
walkDates.forEach(function(w) {
  var btn = document.createElement('button');
  btn.className = 'filter-pill';
  btn.dataset.date = w.date;
  btn.innerHTML = '<div class="filter-dot" style="background:' + w.color + '"></div>' + w.display;
  btn.addEventListener('click', function() { filterBenches(w.date, btn); });
  filterContainer.appendChild(btn);
});

// Place bench markers
var allMarkers = [];
var dedCount = 0;

BENCHES.forEach(function(b) {
  var color = WALK_COLORS[b.date] || '#7aaa6e';
  var hasDed = b.hasDedication;
  if (hasDed) dedCount++;

  var size = hasDed ? 20 : 14;
  var circle = L.marker([b.lat, b.lon], {
    icon: L.divIcon({
      className: 'bench-icon',
      html: '<svg viewBox="0 0 16 16" width="' + size + '" height="' + size + '" style="opacity:' + (hasDed ? 0.95 : 0.65) + '">' +
            '<g fill="' + color + '" stroke="#fff" stroke-width="0.5">' +
            '<rect x="2" y="2" width="12" height="1.7" rx="0.4"/><rect x="2" y="4.4" width="12" height="1.7" rx="0.4"/>' +
            '<rect x="1" y="8" width="14" height="2.2" rx="0.5"/>' +
            '<rect x="2.2" y="10.2" width="2.2" height="4.4"/><rect x="11.6" y="10.2" width="2.2" height="4.4"/>' +
            '</g></svg>',
      iconSize: [size, size],
      iconAnchor: [size / 2, size / 2],
      popupAnchor: [0, -size / 2],
    }),
  });

  var popupContent =
    '<div class="popup-date">' + b.date + '</div>' +
    (hasDed
      ? '<div class="popup-ded">' + b.dedication + '</div>'
      : '<div class="popup-no-ded">no dedication recorded</div>');

  circle.bindPopup(popupContent, { maxWidth: 240, minWidth: 160 });

  circle.addTo(benchMap);
  allMarkers.push({ marker: circle, date: b.date, hasDed: hasDed });
});

document.getElementById('ded-count').textContent = dedCount;

var activeDate = 'all';
function filterBenches(date, btn) {
  activeDate = date;
  document.querySelectorAll('.filter-pill').forEach(function(p) {
    p.classList.remove('active');
    p.style.background = '';
    p.style.borderColor = '';
    p.style.color = '';
  });
  btn.classList.add('active');
  if (date === 'all') {
    btn.style.background = '#4e5840';
    btn.style.borderColor = '#4e5840';
    btn.style.color = '#fff';
  } else {
    var w = walkDates.find(function(x) { return x.date === date; });
    btn.style.background = w ? w.color : '#7aaa6e';
    btn.style.borderColor = 'transparent';
    btn.style.color = '#fff';
  }

  allMarkers.forEach(function(m) {
    if (date === 'all' || m.date === date) {
      m.marker.addTo(benchMap);
    } else {
      m.marker.removeFrom(benchMap);
    }
  });
}
</script>
