<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Map of the 671 benches with dedications in Golden Gate Park, San Francisco. Hover or tap a bench to read its plaque.">
<title>Golden Gate Park Bench Dedications</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,400;0,600;0,800;1,400&family=Overpass+Mono:wght@500&family=Cormorant+Garamond:wght@600&display=swap">
<style>
/* Layout: park-service map sheet — title block with the count, full-park map panel, key strip beneath */
:root{
  --paper:#E8ECE1; --ink:#26302A; --muted:#5E6B60; --rule:#C8D0BF;
  --street:#F3F4EE; --streetline:#D3D8CC; --park:#BCD3A4; --field:#ABC791; --water:#93BACB; --water-ink:#2F5E70;
  --sand:#E2D6AE; --ocean:#86AABD; --road:#F6F4E8;
  --plaque:#8A5A1E; --plaque-hi:#C8913F; --plain:#4C5A50;
  --btn:#26302A; --btn-ink:#E8ECE1; --card:#F8F9F4;
  --display:"Overpass",system-ui,sans-serif; --serif:"Cormorant Garamond","Iowan Old Style",Georgia,serif; --mono:"Overpass Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#161C18; --ink:#E3E8DD; --muted:#9AA79B; --rule:#2F3A32;
  --street:#1C231E; --streetline:#2A332C; --park:#253A2B; --field:#2D4733; --water:#21485A; --water-ink:#8EC1D3;
  --sand:#3A3626; --ocean:#183340; --road:#3B473D;
  --plaque:#E3A954; --plaque-hi:#F6CD86; --plain:#A9B6AA;
  --btn:#E3E8DD; --btn-ink:#161C18; --card:#1F2722; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#161C18; --ink:#E3E8DD; --muted:#9AA79B; --rule:#2F3A32;
  --street:#1C231E; --streetline:#2A332C; --park:#253A2B; --field:#2D4733; --water:#21485A; --water-ink:#8EC1D3;
  --sand:#3A3626; --ocean:#183340; --road:#3B473D;
  --plaque:#E3A954; --plaque-hi:#F6CD86; --plain:#A9B6AA;
  --btn:#E3E8DD; --btn-ink:#161C18; --card:#1F2722; color-scheme:dark }
body{background:var(--paper);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.5}
.wrap{max-width:1320px;margin:0 auto;padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px 32px;border-bottom:2px solid var(--ink);padding-bottom:14px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
h1{font-size:clamp(26px,4vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:4px 0 0;text-wrap:balance}
.tally{display:flex;gap:28px;flex-wrap:wrap;margin:0}
.tally div{display:grid}
.tally dt{font-size:12px;color:var(--muted);order:2;max-width:18ch;line-height:1.3}
.tally dd{margin:0;font-family:var(--mono);font-size:clamp(28px,4vw,42px);line-height:1;font-variant-numeric:tabular-nums;order:1}
.tally .hero dd{color:var(--plaque)}
.bar{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
.key{display:flex;flex-wrap:wrap;gap:8px 20px;margin:0;padding:0;list-style:none;font-size:14px}
.key li{display:flex;align-items:center;gap:8px}
.key svg{flex:none}
.seg{display:inline-flex;border:2px solid var(--btn);border-radius:3px;overflow:hidden}
.seg button{font:600 13px var(--display);border:0;background:transparent;color:var(--ink);padding:6px 12px 4px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.seg button:focus-visible{outline:3px solid var(--plaque-hi);outline-offset:-3px}
.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.controls span{font-size:12px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em}
.mapbox{overflow:auto;border:1px solid var(--rule);background:var(--street);overscroll-behavior-x:contain}
svg.map{display:block;width:calc(100% * var(--z,1));min-width:calc(900px * var(--z,1));height:auto}
.lbl{font-family:var(--display);font-size:6px;fill:var(--muted);letter-spacing:.03em;paint-order:stroke;stroke:var(--park);stroke-width:1.6px;stroke-opacity:.8}
.lbl.street{font-size:6px;text-transform:uppercase;letter-spacing:.16em;stroke:var(--street)}
.lbl.water{font-style:italic;fill:var(--water-ink)}
.lbl.big{font-size:8px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;stroke:none;fill:var(--street)}
#benches circle{fill:var(--plaque);stroke:var(--paper);stroke-width:.5}
#hl{fill:none;stroke:var(--ink);stroke-width:1.2;pointer-events:none}
.mapwrap{position:relative;min-width:0}
.tip{position:absolute;z-index:5;width:min(300px,calc(100vw - 48px));background:var(--card);color:var(--ink);border:1px solid var(--rule);border-top:3px solid var(--plaque);border-radius:4px;box-shadow:0 10px 30px rgb(0 0 0 / .18);padding:12px 14px 10px;pointer-events:none;display:grid;gap:10px}
.tip.pinned{pointer-events:auto}
.plaque{font-family:var(--serif);font-weight:600;font-size:15px;letter-spacing:.01em;line-height:1.35;margin:0;text-wrap:balance}
.plaque span{display:block}
.tip .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 3px}
.tip .sep{border-top:1px dashed var(--rule);padding-top:8px}
.tip .more{font-size:12px;color:var(--muted);margin:0}
.tip .x{position:absolute;top:4px;right:6px;border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:4px}
.tip:not(.pinned) .x{display:none}
.lbl.credit{font-size:5.5px;stroke:var(--street);text-decoration:underline;text-decoration-color:var(--rule)}
.note{color:var(--muted);font-size:13px;margin:0;max-width:75ch}
</style>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
</head>

  const map=document.getElementById("map"),box=document.getElementById("mapbox"),wrap=document.getElementById("mapwrap"),tip=document.getElementById("tip"),hl=document.getElementById("hl");
  let pinned=null,cur=null;
  document.querySelectorAll("[data-z]").forEach(b=>b.addEventListener("click",()=>{
    const cx=(box.scrollLeft+box.clientWidth/2)/box.scrollWidth, cy=(box.scrollTop+box.clientHeight/2)/box.scrollHeight;
    map.style.setProperty("--z",b.dataset.z);
    document.querySelectorAll("[data-z]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
    box.scrollLeft=cx*box.scrollWidth-box.clientWidth/2; box.scrollTop=cy*box.scrollHeight-box.clientHeight/2;
    if(cur!==null)place(cur);
  }));
  function svgPt(e){const p=map.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(map.getScreenCTM().inverse())}
  function nearest(e){
    const p=svgPt(e),scale=map.getScreenCTM().a,lim=(e.pointerType==="touch"?16:9)/scale;
    let bi=-1,bd=lim*lim;
    for(let i=0;i<B.length;i++){const dx=B[i][0]-p.x,dy=B[i][1]-p.y,d=dx*dx+dy*dy;if(d<bd){bd=d;bi=i}}
    return bi;
  }
  function plaqueHTML(txt){const el=document.createElement("p");el.className="plaque";txt.split(" / ").forEach(l=>{const s=document.createElement("span");s.textContent=l;el.appendChild(s)});return el}
  function fill(i){
    tip.replaceChildren();
    const same=B.map((b,j)=>j).filter(j=>Math.abs(B[j][0]-B[i][0])<.4&&Math.abs(B[j][1]-B[i][1])<.4);
    const x=document.createElement("button");x.className="x";x.type="button";x.setAttribute("aria-label","Close");x.textContent="×";x.addEventListener("click",unpin);tip.appendChild(x);
    same.slice(0,2).forEach((j,k)=>{
      B[j][2].forEach((txt,n)=>{
        const sec=document.createElement("div");if(k||n)sec.className="sep";
        const lab=document.createElement("p");lab.className="lab";lab.textContent=(same.length>1?`Bench ${k+1} of ${same.length} here · `:"")+(B[j][2].length>1?(n?"Second plaque":"First plaque"):"Plaque");
        sec.appendChild(lab);sec.appendChild(plaqueHTML(txt));tip.appendChild(sec);
      });
    });
    if(same.length>2){const m=document.createElement("p");m.className="more";m.textContent=`+${same.length-2} more benches at this spot. Zoom in to separate them.`;tip.appendChild(m)}
  }
  function place(i){
    const r=map.getScreenCTM(),wr=wrap.getBoundingClientRect();
    const sx=r.a*B[i][0]+r.e-wr.left, sy=r.d*B[i][1]+r.f-wr.top;
    tip.hidden=false;
    const tw=tip.offsetWidth,th=tip.offsetHeight,W=wrap.clientWidth;
    let left=sx+14; if(left+tw>W-4)left=sx-14-tw; if(left<4)left=Math.max(4,Math.min(W-tw-4,sx-tw/2));
    let top=sy-th/2; if(top<-40)top=-40;
    if(left<=sx&&left+tw>=sx){top=sy+14}

  }

  map.addEventListener("pointermove",e=>{if(pinned!==null||e.pointerType==="touch")return;const i=nearest(e);if(i<0){hide();map.style.cursor="";return}map.style.cursor="pointer";show(i)});

  addEventListener("resize",()=>{if(cur!==null)place(cur)});
